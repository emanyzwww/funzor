# git-cliff 配置: 只负责按提交类型分组
# 版本标题、摘要、贡献者由 scripts/build-release-notes.ps1 合成
# 本地预览: git cliff --latest --strip header

[changelog]
header = ""
body = """{% for group in ["新功能", "性能优化", "问题修复", "重构", "代码格式", "文档", "测试", "构建", "CI", "杂项", "回滚", "其他"] %}{% set items = commits | filter(attribute="group", value=group) %}{% if items | length > 0 %}## {{ group }}

{% for commit in items %}- {{ commit.message }}
{% endfor %}
{% endif %}{% endfor %}"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
fail_on_unmatched_commit = true
split_commits = false
sort_commits = "newest"

commit_parsers = [
  { message = "^feat", group = "新功能" },
  { message = "^perf", group = "性能优化" },
  { message = "^fix", group = "问题修复" },
  { message = "^refactor", group = "重构" },
  { message = "^style", group = "代码格式" },
  { message = "^docs", group = "文档" },
  { message = "^test", group = "测试" },
  { message = "^build", group = "构建" },
  { message = "^ci", group = "CI" },
  { message = "^chore", group = "杂项" },
  { message = "^revert", group = "回滚" },
  { message = ".*", group = "其他" },
]

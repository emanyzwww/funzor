name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 校验 PR 标题符合 Conventional Commits: `<type>(<scope>): <description>`
      # 配合 squash merge 使用, PR 标题会成为最终提交, 被 git-cliff 用于生成发行说明
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            perf
            fix
            refactor
            style
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
